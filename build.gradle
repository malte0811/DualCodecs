plugins {
    id 'net.neoforged.moddev' version "$mdg_version"
}

group = 'malte0811'
version = "$dualcodecs_version"
base {
    archivesName = 'DualCodecs'
}

neoForge {
    neoFormVersion = "$neoform_version"
    addModdingDependenciesTo sourceSets.test
}

sourceSets {
    main
    codegen {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    generated {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

dependencies {
    codegenImplementation 'com.squareup:javapoet:1.13.0'
    testImplementation(platform group: 'org.junit', name: 'junit-bom', version: '6.0.1')
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter'
    testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher'
}

test {
  useJUnitPlatform()
}

jar {
    from sourceSets.generated.output
    from sourceSets.main.output
    manifest {
        attributes "FMLModType": "GAMELIBRARY"
    }
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    from sourceSets.generated.allSource
    from sourceSets.main.allSource
    archiveClassifier = 'sources'
}

artifacts {
    archives jar
    archives sourcesJar
}

tasks.register('generateCode', JavaExec) {
    mainClass = 'malte0811.dualcodecs.GeneratorMain'
    classpath = sourceSets.codegen.runtimeClasspath
}

apply plugin: 'maven-publish'

publishing {
    repositories {
        maven {
            url = "file://" + (System.getenv("local_maven") != null ? System.getenv("local_maven") : System.getenv("bamboo_local_maven"))
        }
    }
    publications {
        maven(MavenPublication) {
            groupId = project.group
            version = project.version
            artifactId = project.base.archivesName

            artifact jar
            artifact sourcesJar

            pom {
                name = project.base.archivesName
                description = project.base.archivesName
                url = ''
                scm {
                    url = 'https://github.com/malte0811/DualCodecs'
                    connection = 'scm:git:git@github.com/malte0811/DualCodecs.git'
                    developerConnection = 'scm:git:git@github.com/malte0811/DualCodecs.git'
                }
                issueManagement {
                    system = 'github'
                    url = 'https://github.com/malte0811/DualCodecs/issues'
                }

                developers {
                    developer {
                        id = 'malte0811'
                        name = 'malte0811'
                    }
                }
            }
        }
    }
}
